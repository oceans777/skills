name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-debug:
    name: Shell debug (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and run shell tests
        run: |
          git init -q "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$GITHUB_WORKSPACE" fetch -q --depth 1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -q FETCH_HEAD
          git -C "$GITHUB_WORKSPACE" -c protocol.version=2 submodule update -q --init --recursive
          cd "$GITHUB_WORKSPACE"
          ./oceans validate
          ./oceans test

  powershell-debug:
    name: PowerShell debug (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Fetch and parse PowerShell files
        shell: pwsh
        run: |
          git init -q $env:GITHUB_WORKSPACE
          git -C $env:GITHUB_WORKSPACE remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git -C $env:GITHUB_WORKSPACE fetch -q --depth 1 origin $env:GITHUB_SHA
          git -C $env:GITHUB_WORKSPACE checkout -q FETCH_HEAD
          git -C $env:GITHUB_WORKSPACE -c protocol.version=2 submodule update -q --init --recursive
          Set-Location $env:GITHUB_WORKSPACE
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($parseError in @($errors)) {
              $failed = $true
              Write-Host "$($_.FullName):$($parseError.Extent.StartLineNumber): $($parseError.Message)"
            }
          }
          if ($failed) { exit 1 }
          .\oceans.ps1 validate
