name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-validation:
    name: Shell validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          show-progress: false
      - name: Validate skills
        run: ./oceans validate

  shell-tests:
    name: Shell test (${{ matrix.os }}, ${{ matrix.test }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        test:
          - test-add-skill-from-url.sh
          - test-install-local-first.sh
          - test-publish-skills.sh
          - test-skill-catalog.sh
          - test-validate-duplicates.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          show-progress: false
      - name: Run Shell test
        shell: sh
        run: |
          set +e
          sh "./scripts/${{ matrix.test }}" > test-output.txt 2>&1
          code=$?
          cat test-output.txt
          exit "$code"
      - name: Upload Shell test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-${{ matrix.os }}-${{ matrix.test }}
          path: test-output.txt
          if-no-files-found: error

  powershell-validation:
    name: PowerShell validation (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          show-progress: false
      - name: Parse PowerShell files
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($parseError in @($errors)) {
              $failed = $true
              Write-Host "$($_.FullName):$($parseError.Extent.StartLineNumber): $($parseError.Message)"
            }
          }
          if ($failed) { exit 1 }
      - name: Validate skills
        shell: pwsh
        run: .\oceans.ps1 validate

  powershell-tests:
    name: PowerShell test (${{ matrix.test }})
    strategy:
      fail-fast: false
      matrix:
        test:
          - test-add-skill-from-url.ps1
          - test-install-local-first.ps1
          - test-publish-skills.ps1
          - test-skill-catalog.ps1
          - test-validate-duplicates.ps1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          show-progress: false
      - name: Run PowerShell test
        shell: pwsh
        run: |
          $records = & pwsh -NoProfile -File ".\scripts\${{ matrix.test }}" *>&1
          $code = $LASTEXITCODE
          $text = @($records | ForEach-Object { $_ | Out-String }) -join ""
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "test-output.txt"),
            $text,
            (New-Object System.Text.UTF8Encoding($false))
          )
          Write-Host $text
          exit $code
      - name: Upload PowerShell test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powershell-${{ matrix.test }}
          path: test-output.txt
          if-no-files-found: error
