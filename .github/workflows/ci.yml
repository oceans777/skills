name: CI

on:
  push:
  pull_request:

jobs:
  shell:
    name: Shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          show-progress: false
      - name: Validate skills
        run: ./oceans validate
      - name: Run shell tests
        run: ./oceans test

  powershell:
    name: PowerShell debug (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Fetch and run isolated PowerShell test
        shell: pwsh
        run: |
          git init -q $env:GITHUB_WORKSPACE
          git -C $env:GITHUB_WORKSPACE remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git -C $env:GITHUB_WORKSPACE fetch -q --depth 1 origin $env:GITHUB_SHA
          git -C $env:GITHUB_WORKSPACE checkout -q FETCH_HEAD
          & "$env:GITHUB_WORKSPACE\scripts\test-add-skill-from-url.ps1"
