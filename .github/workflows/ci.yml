name: CI

on:
  push:
  pull_request:

jobs:
  shell:
    name: Shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          show-progress: false
      - name: Validate skills
        run: ./oceans validate
      - name: Run shell tests
        run: ./oceans test

  powershell:
    name: PowerShell debug (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false
      - name: Run isolated PowerShell test
        shell: pwsh
        run: .\scripts\test-add-skill-from-url.ps1
