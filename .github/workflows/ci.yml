name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Validate skills
        run: ./oceans validate
      - name: Run shell tests
        run: ./oceans test

  powershell-validation:
    name: PowerShell validation (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Parse PowerShell files
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($parseError in @($errors)) {
              $failed = $true
              Write-Host "$($_.FullName):$($parseError.Extent.StartLineNumber): $($parseError.Message)"
            }
          }
          if ($failed) { exit 1 }
      - name: Validate skills
        shell: pwsh
        run: .\oceans.ps1 validate

  powershell-tests:
    name: PowerShell test (${{ matrix.test }})
    strategy:
      fail-fast: false
      matrix:
        test:
          - test-add-skill-from-url.ps1
          - test-install-local-first.ps1
          - test-publish-skills.ps1
          - test-skill-catalog.ps1
          - test-validate-duplicates.ps1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Run PowerShell test
        shell: pwsh
        run: '& ".\scripts\${{ matrix.test }}"'
